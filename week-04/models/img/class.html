function compress(s, pre) {
//UTF8
s = unescape(encodeURIComponent(s));
var arr = [];
for (var i = 0; i < s.length; i++) {
	arr.push(s.charCodeAt(i));
}
var compressor = new Zopfli.RawDeflate(arr);
var compressed = compressor.compress();
dest = "//www.plantuml.com/plantuml" + pre + encode64_(compressed);
window.location.href = dest;
}
function backto(s) {
	var i = s.lastIndexOf("/");
	if (i!=-1) s = s.substring(i+1);

	dest = "//www.plantuml.com/plantuml" + "/uml/"+s;

	window.location.href = dest;
}
</script>

<textarea name="text" id="inflated" spellcheck="false" onkeyup="sendCode()">@startuml
title Smart Campus Study Room Booking - Domain Class Diagram

skinparam classAttributeIconSize 0

class Student {
  - studentId: String
  - name: String
}

class Room {
  - roomId: String
  - name: String
  - blocked: Boolean

  + block()
  + unblock()
}

class Booking {
  - bookingId: String
  - startTime: DateTime
  - endTime: DateTime
  - status: BookingStatus

  + getDuration(): Duration
  + overlaps(other: Booking): Boolean
  + cancel()
}

class Administrator {
  - administratorId: String
  - name: String

  + blockRoom(room: Room)
  + unblockRoom(room: Room)
  + reviewUsage(startDate: Date, endDate: Date)
}

enum BookingStatus {
  ACTIVE
  CANCELLED
}

Student "1" -- "0..*" Booking : makes &gt;
Room "1" -- "0..*" Booking : reserved for &gt;

note right of Booking
R1:
startTime must be in the future.
Duration must be &gt; 0 and &lt;= 2 hours.

R2:
ACTIVE bookings for the same Room
must not overlap.

Touching bookings are allowed:
endTime = another startTime
is not an overlap.
end note

note right of Room
R3:
A blocked Room cannot accept
a new Booking.

Blocking does not automatically
cancel existing Bookings.
end note

note bottom of Booking
R4:
A successful booking produces
a confirmation.

US-04:
A successful cancellation also
produces a confirmation.
end note

note bottom of Administrator
US-05:
Administrator blocks or unblocks rooms.

US-06:
Administrator reviews usage based
on Booking information over
a selected period.
end note
@enduml</textarea>

<script>
function splitLines(t) { return t.split(/\r\n|\r|\n/); }

function doSomething(num) {
	var src = document.getElementById('theimg').src;
		
	
	const regex = /\/png\/theme\/[-_a-zA_Z0-9\/]+\//;
	src = src.replace(regex, '/png/');
	

	var tname;
	if (num>0) {
		tname = document.getElementById('stheme').options[num].text;
		
		src = src.replace('/png/', '/png/theme/' + tname + '/');
		
	}
	document.getElementById('theimg').src = src;
	
	tab = splitLines(document.getElementById('inflated').value);
	res = "";
	for (const ss of tab) {
		if (ss.startsWith("!theme ") == false) res = res + ss + "\r\n";
		if (num>0 && ss.startsWith("@start")) res = res + "!theme " + tname + "\r\n";
	}
	res = res.substring(0, res.length - 2);
	document.getElementById('inflated').value = res;

}
</script>


<script>
var last = Date.now();
var ltext = "";
var lx=0,ly=0,lw=0,lh=0;

function sendCode(){
last = Date.now();
}

function watchdog() {
if (childOpen()){
win.document.getElementById('theimg').src = GID('theimg').src;
lx=win.screenX;
ly=win.screenY;
lh=win.outerHeight;
lw=win.outerWidth;
}else{
GID('inflated').style.height="";
GID('ewindow').className = "picon";
GID('cde').style.display = "flex";
GID('hlong').style.display = "none";
}
var diff = Date.now() - last
var current = GID("inflated").value;
if (diff > 1000 && current != ltext) {
  ltext = current;
  comp2 = compress2(current);
  tmp = GID('theimg').src;

  tmp = tmp.substring(0, tmp.indexOf('/png/')) + "/png/" +comp2;

  GID('theimg').src = tmp;
  if (childOpen())
	  win.document.getElementById('theimg').src = tmp;
  GID('urlpng').href = tmp;
  tmp = GID('urlsvg').href;

  GID('urljs').href = "https://editor.plantuml.com/uml/" + comp2;
  tmp = tmp.substring(0, tmp.indexOf('/svg/')) + "/svg/" +comp2;

  GID('urlsvg').href = tmp;
  tmp = GID('urltxt').href;
  tmp = tmp.substring(0, tmp.indexOf('/txt/')) + "/txt/" +comp2;
  GID('urltxt').href = tmp;
  tmp = GID('url').value;
  
  tmp = tmp.substring(0, tmp.indexOf('/png/')) + "/png/" +comp2;
  
  GID('url').value = tmp;

}
}

function compress2(s) {
	//UTF8
	s = unescape(encodeURIComponent(s));
	var arr = [];
	for (var i = 0; i < s.length; i++)
		arr.push(s.charCodeAt(i));	
	var compressor = new Zopfli.RawDeflate(arr);
	var compressed = compressor.compress();
	return encode64_(compressed);
}

function chauto() {
if (GID('irefresh').className == "agray") {
GID('irefresh').className = "ablue";
myTimer = setInterval("watchdog()", 900);
} else {
GID('irefresh').className = "agray";
clearInterval(myTimer);
}
}
</script>
